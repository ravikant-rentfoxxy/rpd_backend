services:
  postgres:
    image: postgres:16
    container_name: rpd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rpd
      POSTGRES_USER: rpd
      POSTGRES_PASSWORD: rpd_dev_password
      TZ: Asia/Kolkata
    ports:
      - '5432:5432'
    volumes:
      - rpd_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rpd -d rpd']
      interval: 8s
      timeout: 5s
      retries: 10
    networks:
      - rpd_net

  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: rpd-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rpd.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '5050:80'
    volumes:
      - rpd_pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rpd_net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: rpd-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rpdminio
      MINIO_ROOT_PASSWORD: rpd_minio_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rpd_minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - rpd_net

volumes:
  rpd_pg_data:
  rpd_pgadmin_data:
  rpd_minio_data:

networks:
  rpd_net:
    driver: bridge
